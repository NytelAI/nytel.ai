  general_email: "contact@nytel.ai"
  general_email_source: "Vadim, Nov 1 2026 (keep contact@nytel.ai as the general inbox; Matthew is the named contact)"
  source: "Vadim, Nov 1 2026 (\"use Matthew's information for contact\")"

