mockup_direction: compiler
# LOCAL MOCKUP KEYS for the interactive hero (not in the knowledge-base master).
# Hero examples approved (Marketing copy, 1 Nov 2026). Clauses are illustrative examples, not quotes from the whitepaper.
# {N} marks a configurable parameter; the template renders it from hero_local (n_default, n_label). Not literal brackets.
hero:
  source_label: Example SOP clauses
  rule_labels: [CONDITION, CHECK, ACTION]
  examples:
  - line: No site shall be initiated or receive investigational product until every required essential document is collected, reviewed, and the readiness checklist is signed off.
    condition: site initiation or drug shipment requested
    check: essential documents on file; readiness checklist signed
    action: hold; list missing items for the owner
  - line: For IND studies, every sub-investigator on Form 1572 must appear on the delegation log, and delegated investigator-level staff must appear on the current 1572.
    condition: 1572 or delegation log changes (IND study)
    check: 1572 sub-investigators on the log, and the reverse
    action: flag for the regulatory coordinator and PI
  - line: When a revised consent form receives IRB approval, participants the IRB requires to re-consent must sign that version before further study procedures.
    condition: revised consent form approved, or any consent signed
    check: each active participant the IRB requires signed the current version
    action: flag for re-consent; draft a notice for the PI and coordinator
  - line: A critical monitoring finding must reach the study lead at once and be escalated if unresolved after {N} business days.
    condition: critical finding logged
    check: unresolved > {N} business days
    action: draft a notice for the study lead; draft an escalation to the next named level if overdue

# Hero option A (approved by Vadim via Kate, 1 Nov 2026). Merge into the knowledge-base master under hero:
hero_local:
  n_default: 5
  n_label: 'N, configurable, in business days'
  topics: [Site activation, Delegation log, Re-consent, Escalation]   # tab labels, in hero.examples order
  check_lead: 'finding unresolved > {N} business days'
  schedule_label: SCHEDULE
  schedule_cron: '0 7 * * 1-5'
  schedule_cron_gloss: '07:00, Monday to Friday'
  action_chips:   # ACTION command chips, in hero.examples order; one chip per '; '-separated part of the action (approved 1 Nov 2026)
  - ['hold(site)', 'draft_missing_items(owner)']
  - ['flag(reg_coord, pi)']
  - ['flag(re_consent)', 'draft_notice(pi, coord)']
  - ['draft_notice(study_lead)', 'draft_escalation(next_level)']
